AllCops:
  NewCops: enable
  TargetRubyVersion: 3.4
  Exclude:
    - 'db/**/*'
    - 'db/schema.rb'
    - 'vendor/**/*'
    - 'Gemfile.lock'
    - 'config.ru'
    - 'rakefile'
    - '*.rake'

Style/Documentation:
  Enabled: false

Layout/LineLength:
  Max: 120

Metrics/MethodLength:
  Max: 20

Metrics/AbcSize:
  Max: 20

Metrics/BlockLength:
  Max: 25
  Exclude:
    - 'test/**/*'

